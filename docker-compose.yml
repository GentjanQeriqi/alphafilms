version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: alphafilms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-alphafilms}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME:-alphafilms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alphafilms']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./alphafilms-be
      dockerfile: Dockerfile
    container_name: alphafilms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-alphafilms}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-alphafilms}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - '3000'

  frontend:
    build:
      context: ./alphafilms
      dockerfile: Dockerfile
    container_name: alphafilms-frontend
    restart: unless-stopped
    expose:
      - '80'

  nginx:
    image: nginx:alpine
    container_name: alphafilms-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/nginx/certs:ro
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
